@if (modalState$ | async; as state) {
  @if (state.show) {
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">

      <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 z-50">
        <h3 class="text-xl font-bold text-gray-900 mb-4">Confirmación</h3>
        <p class="text-gray-600 mb-6">{{ state.message }}</p>

        <div class="flex justify-end space-x-3">
          <button (click)="cancel()" class="py-2 px-4 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300">
            Cancelar
          </button>
          <button (click)="confirm()" class="py-2 px-4 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700">
            Aceptar
          </button>
        </div>
      </div>
    </div>
  }
}
