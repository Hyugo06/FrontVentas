<div class="h-[100dvh] w-full flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 p-4 font-sans overflow-hidden relative">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[10%] -right-[10%] w-96 h-96 bg-indigo-500 rounded-full blur-3xl opacity-20"></div>
    <div class="absolute -bottom-[10%] -left-[10%] w-96 h-96 bg-purple-500 rounded-full blur-3xl opacity-20"></div>
  </div>

  <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8 relative z-10 flex flex-col justify-center">

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white font-bold text-2xl shadow-lg mb-3">
        TM
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Bienvenido</h2>
      <p class="text-slate-400 text-xs mt-1">Ingresa tus credenciales para continuar</p>
    </div>

    <form class="space-y-5">

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-slate-300 uppercase tracking-wider ml-1">Usuario</label>
        <div class="relative group">
          <input [(ngModel)]="credenciales.username" name="username" type="text" placeholder="ej. admin"
                 class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pl-10 text-sm">
          <svg class="w-5 h-5 text-slate-500 absolute left-3 top-3 group-focus-within:text-indigo-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-bold text-slate-300 uppercase tracking-wider ml-1">Contraseña</label>
        <div class="relative group">
          <input [(ngModel)]="credenciales.password" name="password"
                 [type]="showPassword ? 'text' : 'password'"
                 placeholder="••••••••"
                 class="w-full px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pl-10 pr-10 text-sm">

          <!-- Icono Candado (Izquierda) -->
          <svg class="w-5 h-5 text-slate-500 absolute left-3 top-3 group-focus-within:text-indigo-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>

          <!-- Botón Ojo (Derecha) -->
          <button type="button" (click)="togglePasswordVisibility()" class="absolute right-3 top-3 text-slate-500 hover:text-white focus:outline-none transition-colors">
            @if (showPassword) {
              <!-- Ojo Abierto (Mostrar) -->
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            } @else {
              <!-- Ojo Tachado (Ocultar) -->
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error) {
        <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold flex items-center gap-2 animate-pulse">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          {{ error }}
        </div>
      }

      <button type="button" (click)="login()"
              class="w-full py-3.5 mt-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transform transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500">
        Ingresar
      </button>

    </form>

    <div class="mt-6 text-center">
      <p class="text-[10px] text-slate-500">© 2025 Tienda Margarita. Panel Administrativo.</p>
    </div>
  </div>
</div>
