<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 p-4 font-sans">

  <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8 sm:p-10 relative overflow-hidden">

    <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500 rounded-full blur-3xl opacity-20"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500 rounded-full blur-3xl opacity-20"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white font-bold text-2xl shadow-lg mb-4">
        TM
      </div>
      <h2 class="text-3xl font-bold text-white tracking-tight">Bienvenido</h2>
      <p class="text-slate-400 text-sm mt-2">Ingresa tus credenciales para continuar</p>
    </div>

    <form class="space-y-6 relative z-10">

      <div class="space-y-2">
        <label for="username" class="text-xs font-bold text-slate-300 uppercase tracking-wider ml-1">Usuario</label>
        <div class="relative">
          <input [(ngModel)]="credenciales.username" name="username" type="text" placeholder="ej. admin"
                 class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pl-10">
          <svg class="w-5 h-5 text-slate-500 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>
      </div>

      <div class="space-y-2">
        <label for="password" class="text-xs font-bold text-slate-300 uppercase tracking-wider ml-1">Contraseña</label>
        <div class="relative">
          <input [(ngModel)]="credenciales.password" name="password" type="password" placeholder="••••••••"
                 class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pl-10">
          <svg class="w-5 h-5 text-slate-500 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
        </div>
      </div>

      @if (error) {
        <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-2 animate-pulse">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          {{ error }}
        </div>
      }

      <button type="button" (click)="login()"
              class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transform transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500">
        Ingresar
      </button>

    </form>

    <div class="mt-8 text-center">
      <p class="text-xs text-slate-500">© 2025 Tienda Margaríta. Panel Administrativo.</p>
    </div>
  </div>
</div>
