<div class="max-w-5xl mx-auto mt-8 px-4 mb-10">

  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

    <div class="bg-slate-50 px-6 py-5 border-b border-slate-100 flex items-center gap-4">
      <div class="h-10 w-10 rounded-lg bg-indigo-100 flex items-center justify-center text-indigo-600 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2a3 3 0 003 3h2v4h-2a3 3 0 00-3 3v2H9v-2a3 3 0 00-3-3H4v-4h2a3 3 0 003-3V5h6z" />
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800">Generar Nuevo Cupón</h2>
        <p class="text-sm text-slate-500">Configura los descuentos y reglas de validación</p>
      </div>
    </div>

    <div class="p-6 md:p-8">
      <form [formGroup]="form" (ngSubmit)="guardar()">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 mb-8">

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Código del Cupón</label>
            <div class="relative">
              <input type="text" formControlName="codigo" placeholder="Ej: VERANO2025"
                     class="w-full pl-4 pr-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all font-bold uppercase text-slate-700 placeholder-slate-400">
            </div>
            <p *ngIf="form.get('codigo')?.touched && form.get('codigo')?.invalid" class="mt-1 text-xs text-red-500 font-bold ml-1">
              * El código es obligatorio (mín. 3 letras).
            </p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Tipo de Descuento</label>
            <select formControlName="tipoDescuento" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all bg-white text-slate-700 font-medium">
              <option value="PORCENTAJE">Porcentaje (%)</option>
              <option value="FIJO">Monto Fijo (S/)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Valor del Descuento</label>
            <input type="number" formControlName="valor" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-slate-700 font-medium">
            <p *ngIf="form.get('valor')?.touched && form.get('valor')?.invalid" class="mt-1 text-xs text-red-500 font-bold ml-1">
              * Ingresa un valor válido.
            </p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Fecha de Vencimiento</label>
            <input type="date" formControlName="fechaVencimiento" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-slate-700 font-medium">
            <p *ngIf="form.get('fechaVencimiento')?.touched && form.get('fechaVencimiento')?.invalid" class="mt-1 text-xs text-red-500 font-bold ml-1">
              * La fecha es obligatoria.
            </p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Cantidad de Usos (Stock)</label>
            <input type="number" formControlName="usosDisponibles" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-slate-700 font-medium">
          </div>

          <div class="flex items-center h-full pt-4">
            <label class="flex items-center gap-4 cursor-pointer group p-3 rounded-xl hover:bg-slate-50 transition-colors w-full border border-transparent hover:border-slate-200">
              <div class="relative">
                <input type="checkbox" formControlName="activo" class="sr-only peer">
                <div class="w-12 h-7 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-600 shadow-inner"></div>
              </div>
              <div>
                <span class="block text-sm font-bold text-slate-700 group-hover:text-indigo-700">Cupón Activo</span>
                <span class="block text-xs text-slate-400">Habilitar o deshabilitar uso</span>
              </div>
            </label>
          </div>
        </div>

        <div class="border-t border-slate-100 my-8"></div>

        <h3 class="flex items-center gap-2 text-xs font-bold text-indigo-500 uppercase tracking-wider mb-6">
          <span class="bg-indigo-50 px-2 py-1 rounded">Opcional</span>
          Restricciones Avanzadas
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Días Permitidos</label>
            <input type="text" formControlName="diasPermitidos" placeholder="MONDAY,FRIDAY" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all">
            <p class="text-[10px] text-slate-400 mt-1">En inglés, separados por comas.</p>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Hora Inicio</label>
            <input type="time" formControlName="horaInicio" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Hora Fin</label>
            <input type="time" formControlName="horaFin" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all">
          </div>
        </div>

        <div class="flex justify-end gap-4 pt-4 border-t border-slate-50">
          <button type="button" routerLink="/admin/dashboard" class="px-6 py-3 rounded-xl border border-slate-300 text-slate-600 font-bold hover:bg-slate-50 hover:text-slate-800 transition-colors">
            Cancelar
          </button>

          <button type="submit" [disabled]="form.invalid" class="group relative px-8 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-500/30 transition-all disabled:opacity-50 disabled:shadow-none hover:-translate-y-0.5">
            <span class="flex items-center gap-2">
               <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
               </svg>
               Guardar Cupón
            </span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
